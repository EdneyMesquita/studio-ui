[package]
name = "studio-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Design tokens, fonts, icons and hand-painted egui widgets shared by the Studio family of desktop apps."
repository = "https://github.com/EdneyMesquita/studio-ui"
authors = ["Edney Mesquita"]
readme = "README.md"
keywords = ["egui", "ui", "widgets", "design-system"]
categories = ["gui"]
publish = false
include = ["src/**", "assets/fonts/**", "examples/**", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "CHANGELOG.md"]

[dependencies]
egui = "0.36.2"

[features]
# STUDIO_UI_OPEN_MENU test hook (debug builds only): see widgets::menu::dev_once.
dev-hooks = []

[dev-dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
